 const save=()=>{if(!f.zh.trim()&&!f.ko.trim())return alert('請至少輸入中文或韓文名稱');onSave(f)};
 return html`<${Sheet} onClose=${close}><h2>${item?'編輯商品':'新增商品'}</h2>
 ${!item&&html`<div class="blk"><div class="row sp"><span class="bt">AI 自動填入</span><button class="lk" onClick=${()=>setAi(!ai)}>${ai?'收合':'展開'}</button></div>${ai&&html`<div><p class="sub">貼上商品頁文字，或貼上聊天裡整理好的 JSON。AI 只整理你貼上的內容，不會上網搜尋，沒有的資料會留空，圖片請自行上傳。</p><textarea rows="4" placeholder="貼上商品頁文字或 JSON" value=${txt} onChange=${e=>setTxt(e.target.value)}></textarea><div class="row" style=${{marginTop:8}}><button class="pk" disabled=${busy} onClick=${run}>${busy?'解析中…':'開始解析'}</button><button onClick=${()=>{setRes(null);setErr('');setTxt('')}}>重新搜尋</button><button onClick=${()=>setAi(false)}>手動填寫</button></div>${err&&html`<p class="sub" style=${{color:'var(--pkd)'}}>${err}</p>`}${res&&res.map((r,i)=>html`<div class="card" key=${i} style=${{marginTop:8}}><div class="nm">${r.zh||r.en||r.ko||'（無名稱）'}</div><div class="sub">${[r.brand,r.spec,r.color].filter(Boolean).join('・')||'規格未找到'}</div><div class="sub">韓國 ${r.krMin==null?'未找到':wr(r.krMin,r.krMax)}　台灣 ${r.twMin==null?'未找到':tr(r.twMin,r.twMax)}</div>${r.desc&&html`<div class="sub">${r.desc}</div>`}${r.src&&html`<div class="sub" style=${{overflowWrap:'anywhere'}}>${r.src}</div>`}<button class="pk" style=${{width:'100%',marginTop:8}} onClick=${()=>apply(r)}>確認並填入表單</button></div>`)}</div>`}</div>`}
 ${ask&&html`<div class="card" style=${{background:'var(--pk)',marginBottom:8}}>尚未儲存，確定離開？<div class="row"><button onClick=${onClose}>放棄</button><button class="pk" onClick=${()=>setAsk(false)}>繼續編輯</button></div></div>`}
 <${Img} src=${f.img}/>
 <div class="row" style=${{marginTop:8}}><label class="row" style=${{margin:0}}><span style=${{background:'var(--wm)',padding:'10px 14px',borderRadius:14}}>相簿／拍照</span>
  <input type="file" accept="image/*" hidden onChange=${async e=>{const x=e.target.files[0];if(x)set('img',await shrink(x))}}/></label></div>
 <div class="row" style=${{marginTop:8}}><input placeholder="貼上圖片網址" value=${url} onChange=${e=>setUrl(e.target.value)}/><button onClick=${()=>url&&set('img',url)}>套用</button></div>
 ${T('zh','中文商品名稱')}${T('ko','韓文商品名稱')}${T('en','英文名稱（選填）')}${T('brand','品牌')}
 <label>購買地點（可複選）</label><div class="tabs" style=${{flexWrap:'wrap'}}>${db.places.map(p=>html`<button key=${p.id} class=${f.places.includes(p.id)?'on':''} onClick=${()=>set('places',f.places.includes(p.id)?f.places.filter(x=>x!==p.id):[...f.places,p.id])}>${p.name}</button>`)}</div>
 <label>分類</label><select value=${f.cat} onChange=${e=>set('cat',e.target.value)}>${db.cats.map(c=>html`<option key=${c.id} value=${c.id}>${c.name}</option>`)}</select>
 <div class="blk"><div class="bt">商品資訊</div><div class="two"><div>${T('spec','容量／規格')}</div><div>${T('color','推薦色號／款式')}</div></div>${T('desc','用途／說明')}${T('note','備註')}</div>
 <div class="row"><div>${T('krMin','韓國最低 ₩','number')}</div><div>${T('krMax','韓國最高 ₩','number')}</div></div>
 <div class="row"><div>${T('twMin','台灣最低 NT$','number')}</div><div>${T('twMax','台灣最高 NT$','number')}</div></div>
 ${T('qty','預計購買數量','number')}
 <label class="row"><input type="checkbox" style=${{width:24,minHeight:24}} checked=${f.priority} onChange=${e=>set('priority',e.target.checked)}/>優先購買</label>
 <div class="row savebar">${item&&html`<button onClick=${()=>onDelete(item)}>刪除</button>`}<button class="pk" style=${{flex:1}} onClick=${save}>儲存</button></div><//>`}

function Detail({it,db,upd,onEdit,onClose,say}){
 const[zoom,setZ]=useState(false);const[b,setB]=useState({paid:it.paid??it.krMin??'',pq:it.paidQty??it.qty??1,date:it.paidDate||new Date().toISOString().slice(0,10),pl:it.paidPlace||it.places[0]||''});
 const pn=id=>db.places.find(p=>p.id===id)?.name;
 return html`<${Sheet} onClose=${onClose}>
 <${Img} src=${it.img} onClick=${()=>setZ(!zoom)}/>${zoom&&it.img&&html`<div class="ov" style=${{zIndex:30}} onClick=${()=>setZ(false)}><img src=${it.img} style=${{maxWidth:'100%',maxHeight:'100%'}}/></div>`}
 <h2>${it.priority?'★ ':''}${it.zh}</h2>
 <div class="row sp"><span class="ko">${it.ko}</span><button onClick=${()=>copy(it.ko||it.zh,say)}>複製名稱</button></div>
 <div class="sub">${[it.en,it.brand,it.spec,it.color].filter(Boolean).join('・')}</div>
 <p class="kr">${wr(it.krMin,it.krMax)} <span class="sub">${tr(it.twMin,it.twMax)}</span></p>
 <div>${it.places.map(id=>html`<span class="tag" key=${id}>${pn(id)}</span>`)}</div>
 ${it.desc&&html`<p>${it.desc}</p>`}${it.note&&html`<p class="sub">備註：${it.note}</p>`}
 <div class="card" style=${{marginTop:10}}><b>實際購買紀錄</b>
  <div class="row"><div><label>單價 ₩</label><input type="number" inputMode="numeric" value=${b.paid} onChange=${e=>setB({...b,paid:e.target.value})}/></div><div><label>數量</label><input type="number" inputMode="numeric" value=${b.pq} onChange=${e=>setB({...b,pq:e.target.value})}/></div></div>
  <label>日期</label><input type="date" value=${b.date} onChange=${e=>setB({...b,date:e.target.value})}/>
  <label>購買地點</label><select value=${b.pl} onChange=${e=>setB({...b,pl:e.target.value})}><option value="">—</option>${db.places.map(p=>html`<option key=${p.id} value=${p.id}>${p.name}</option>`)}</select>
  <div class="row" style=${{marginTop:10}}>${it.bought&&html`<button onClick=${()=>{upd({...it,bought:false});say('已改回想買')}}>取消已購買</button>`}
  <button class="pk" style=${{flex:1}} onClick=${()=>{upd({...it,bought:true,paid:+b.paid||0,paidQty:+b.pq||1,paidDate:b.date,paidPlace:b.pl});say('已儲存購買紀錄 ✓');onClose()}}>${it.bought?'更新紀錄':'標記已購買'}</button></div></div>
 <div class="row" style=${{marginTop:10}}><button onClick=${()=>upd({...it,priority:!it.priority})}>${it.priority?'取消優先':'優先'}</button><button style=${{flex:1}} onClick=${onEdit}>編輯</button><button onClick=${onClose}>關閉</button></div><//>`}

function Card({it,shop,list,db,open,upd,say}){
 return html`<div class=${'card '+(it.bought?'done ':'')+(shop?'big':'')} onClick=${open}>
  <div class=${list&&!shop?'row':''}><div style=${list&&!shop?{width:96,flex:'none'}:{}}><${Img} src=${it.img}/></div>
  <div style=${{marginTop:list&&!shop?0:8,flex:1}}>
   <div class="nm">${it.priority?'★ ':''}${it.zh}${it.bought?' ✓':''}</div>
   ${it.ko&&html`<div class="ko">${it.ko}</div>`}<div class="kr">${wr(it.krMin,it.krMax)}</div><div class="sub">${tr(it.twMin,it.twMax)}</div>
   ${shop&&html`<div class="row" style=${{marginTop:8}} onClick=${e=>e.stopPropagation()}><button onClick=${()=>copy(it.ko||it.zh,say)}>複製</button>
    <button class=${it.bought?'':'pk'} style=${{flex:1}} onClick=${()=>{upd(it.bought?{...it,bought:false}:{...it,bought:true,paid:it.paid??it.krMin??0,paidQty:it.qty||1,paidDate:new Date().toISOString().slice(0,10)});say(it.bought?'已取消':'已標記購買 ✓')}}>${it.bought?'取消購買':'已買'}</button></div>`}
  </div></div></div>`}

function App(){
 const[db,setDb]=useState(load),[tab,setTab]=useState('home'),[pl,setPl]=useState(''),[cat,setCat]=useState(''),[q,setQ]=useState(''),[flt,setFlt]=useState('all'),[sort,setSort]=useState('custom'),[list,setList]=useState(()=>{try{return localStorage.getItem('kwl-friend-view')==='list'}catch(e){return false}}),[sheet,setSheet]=useState(null),[toast,setToast]=useState(''),[io,setIo]=useState('');
 const setView=v=>{setList(v);try{localStorage.setItem('kwl-friend-view',v?'list':'grid')}catch(e){}};
 const say=m=>{setToast(m);clearTimeout(window._t);window._t=setTimeout(()=>setToast(''),1800)};
 useEffect(()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}},[db]);
 const upd=it=>setDb(d=>({...d,items:d.items.map(x=>x.id===it.id?it:x)}));
 const items=db.items,left=items.filter(i=>!i.bought),spent=items.filter(i=>i.bought).reduce((s,i)=>s+(i.paid||0)*(i.paidQty||1),0);
 let vis=items.filter(i=>(!pl||i.places.includes(pl))&&(!cat||i.cat===cat)&&(flt==='all'||(flt==='todo'&&!i.bought)||(flt==='done'&&i.bought)||(flt==='pri'&&i.priority))&&(!q||[i.zh,i.ko,i.en,i.brand].join(' ').toLowerCase().includes(q.toLowerCase())));
 if(sort==='name')vis=[...vis].sort((a,b)=>a.zh.localeCompare(b.zh,'zh-Hant'));
 if(sort==='lo')vis=[...vis].sort((a,b)=>(a.krMin||0)-(b.krMin||0));
 if(sort==='hi')vis=[...vis].sort((a,b)=>(b.krMin||0)-(a.krMin||0));
 
 const est=left.reduce((s,i)=>[s[0]+(i.krMin||0)*(i.qty||1),s[1]+(i.krMax||i.krMin||0)*(i.qty||1)],[0,0]);
 const byPl=db.places.map(p=>({p,v:items.filter(i=>i.bought&&(i.paidPlace||i.places[0])===p.id).reduce((s,i)=>s+(i.paid||0)*(i.paidQty||1),0)}));
 const save=f=>{setDb(d=>({...d,items:d.items.some(x=>x.id===f.id)?d.items.map(x=>x.id===f.id?f:x):[...d.items,f]}));setSheet(null);say('已儲存 ✓')};
 const del=it=>{if(confirm('確定刪除「'+it.zh+'」？'))setDb(d=>({...d,items:d.items.filter(x=>x.id!==it.id)})),setSheet(null),say('已刪除')};
 const csv=()=>'中文,韓文,品牌,韓幣最低,韓幣最高,台幣最低,台幣最高,數量,已購買,實付單價\n'+items.map(i=>[i.zh,i.ko,i.brand,i.krMin,i.krMax,i.twMin,i.twMax,i.qty,i.bought?'是':'否',i.paid??''].map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')).join('\n');
 const go=t=>{setTab(t);if(t==='list'&&tab!=='list')setPl('')};
 return html`<div>
 ${tab==='home'&&html`<div class="pgcol"><div class="eyebrow">MY KOREA SHOPPING LIST</div><h1>Korea Shopping Wishlist</h1>
  <div class="card"><div class="row sp"><b>購物進度 ${items.length-left.length}/${items.length} 件</b><button onClick=${()=>{setPl('');setTab('list')}} class="ib" aria-label="搜尋">${ic('search')}</button></div>
  <div class="bar"><i style=${{width:(items.length?(items.length-left.length)/items.length*100:0)+'%'}}></i></div><div class="row sp"><span>已花費 <b>${won(spent)}</b></span><span class="sub">預算 ${won(db.budget)}</span></div></div>
  ${!items.length&&html`<div class="card"><b>歡迎，開始建立你的清單</b><p class="sub" style=${{margin:'6px 0 0',lineHeight:1.7}}>1. 點下方「新增」加入想買的商品<br/>2. 到「購買地點」可新增或調整店家<br/>3. 在店裡打開商品，記錄實際購買價格<br/>4. 資料只存在這支手機的這個瀏覽器，請到「預算」頁定期備份</p></div>`}<div class="row sp"><h2>購買地點</h2><button onClick=${()=>setSheet({t:'places'})}>管理</button></div>
  <div class="pg">${db.places.map(p=>html`<div class="card" key=${p.id} style=${{minHeight:80}} onClick=${()=>{setPl(p.id);setTab('list')}}><b>${p.short||p.name}</b><div class="sub row sp"><span>未購買 ${items.filter(i=>!i.bought&&i.places.includes(p.id)).length} 件</span>${ic('chev')}</div></div>`)}</div>
  <p class="sub">價格為自行輸入的參考資料，請以現場標價為準。</p></div>`}
 ${tab==='list'&&html`<div class="pgcol"><div class="row sp"><h1>${pl?db.places.find(p=>p.id===pl)?.name:'購物清單'}</h1>
  <div class="seg" role="group">${[['grid','grid','雙欄'],['list','rows','列表']].map(([k,i,l])=>html`<button key=${k} aria-label=${l} class=${(list?'list':'grid')===k?'on':''} onClick=${()=>setView(k==='list')}>${ic(i)}</button>`)}</div></div>
  <div class="sbox">${ic('search')}<input placeholder="搜尋商品名稱、品牌…" value=${q} onChange=${e=>setQ(e.target.value)}/></div>
  <div class="tabs wr">${[['all','全部'],['todo','尚未購買'],['done','已購買'],['pri','優先']].map(([k,l])=>html`<button key=${k} class=${flt===k?'on':''} onClick=${()=>setFlt(k)}>${l}</button>`)}</div>
  <div class="row sp chdr"><span class="sub">商品分類</span><button class="lk" onClick=${()=>setSheet({t:'cats'})}>管理分類</button></div><div class="tabs wr"><button class=${!cat?'on':''} onClick=${()=>setCat('')}>全部</button>${db.cats.map(c=>html`<button key=${c.id} class=${cat===c.id?'on':''} onClick=${()=>setCat(c.id)}>${c.name}</button>`)}</div>
  <div class="row sp cnt"><span class="sub">共 ${vis.length} 件商品</span><select class="srt" value=${sort} onChange=${e=>setSort(e.target.value)}><option value="custom">自訂順序</option><option value="name">商品名稱</option><option value="lo">韓國價格低→高</option><option value="hi">韓國價格高→低</option></select></div>
  <div class=${'grid '+(list?'one':'')} style=${{marginTop:10}}>${vis.map(i=>html`<${Card} key=${i.id} it=${i} list=${list} db=${db} upd=${upd} say=${say} open=${()=>setSheet({t:'detail',id:i.id})}/>`)}</div>
  ${!vis.length&&html`<p class="sub">沒有符合的商品</p>`}</div>`}
 ${tab==='budget'&&html`<div><h1>預算</h1><div class="card">
  <label>購物預算（₩）</label><input type="number" inputMode="numeric" value=${db.budget} onChange=${e=>setDb({...db,budget:+e.target.value||0})}/>
  <label>匯率（1₩ = NT$）</label><input type="number" step="0.001" value=${db.rate} onChange=${e=>setDb({...db,rate:+e.target.value||0})}/>
  <p>已購買：<b>${won(spent)}</b>（約 NT$${Math.round(spent*db.rate)}）</p><p>剩餘：<b>${won(db.budget-spent)}</b></p>
  <p>未購買預估：${won(est[0])}–${won(est[1])}</p></div>
  <h2>各地點花費</h2><div class="card">${byPl.map(({p,v})=>html`<div class="row sp" key=${p.id}><span>${p.name}</span><b>${won(v)}</b></div>`)}</div>
  <h2>備份</h2><div class="card"><p class="sub">資料只存在此裝置的這個瀏覽器；清除網站資料會遺失，且不會跨裝置同步。請定期備份。</p>
  <div class="row"><button onClick=${()=>{const s=JSON.stringify(db);setIo(s);copy(s,say)}}>JSON 備份</button><button onClick=${()=>{setIo(csv());copy(csv(),say)}}>CSV</button>
  <button onClick=${()=>{try{const d=JSON.parse(io);if(!d.items||!d.places)throw 0;setDb(d);say('已還原 ✓')}catch(e){say('格式錯誤，無法還原')}}}>還原</button></div>
  <textarea rows="5" placeholder="備份內容會顯示於此；還原時請貼上 JSON" value=${io} onChange=${e=>setIo(e.target.value)} style=${{marginTop:8}}></textarea></div></div>`}
 <nav><div>${[['home','home','首頁'],['list','list','清單'],['add','add','新增'],['budget','budget','預算']].map(([k,e,l])=>html`<button key=${k} class=${tab===k?'on':''} onClick=${()=>k==='add'?setSheet({t:'form'}):go(k)}>${ic(e)}<span>${l}</span></button>`)}</div></nav>
 ${sheet?.t==='detail'&&(it=>it&&html`<${Detail} it=${it} db=${db} upd=${upd} say=${say} onClose=${()=>setSheet(null)} onEdit=${()=>setSheet({t:'form',id:it.id})}/>`)(items.find(i=>i.id===sheet.id))}
 ${sheet?.t==='form'&&html`<${Form} item=${items.find(i=>i.id===sheet.id)} db=${db} onSave=${save} onClose=${()=>setSheet(null)} onDelete=${del}/>`}
 ${sheet?.t==='places'&&html`<${Manage} short=${true} title="管理購買地點" list=${db.places} onChange=${v=>setDb({...db,places:v})} onClose=${()=>setSheet(null)}/>`}
 ${sheet?.t==='cats'&&html`<${Manage} title="管理商品分類" list=${db.cats} onChange=${v=>setDb({...db,cats:v})} onClose=${()=>setSheet(null)}/>`}
 ${toast&&html`<div class="toast">${toast}</div>`}</div>`}
ReactDOM.createRoot(document.getElementById('app')).render(React.createElement(App));
</script></body></html>
